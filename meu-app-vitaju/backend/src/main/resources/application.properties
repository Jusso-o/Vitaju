spring.application.name=vitaju-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/vitaju}
spring.datasource.username=${DATABASE_USERNAME:vitaju}
spring.datasource.password=${DATABASE_PASSWORD:vitaju}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
